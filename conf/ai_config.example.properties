# ============================================================
#  大模型接口配置模板
#
#  用法：复制本文件为同目录下的 ai_config.properties，再填入你自己的密钥。
#      copy conf\ai_config.example.properties conf\ai_config.properties
#
#  注意：ai_config.properties 已被 .gitignore 忽略，不会被提交。
#        请勿把真实密钥写进本模板文件。
# ============================================================

# DeepSeek 平台密钥，申请地址：https://platform.deepseek.com/api_keys
# 形如 sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
api_key=

# 模型名
model=deepseek-chat

# 单次回复最大 token 数
max_tokens=500

# 采样温度，越高越随机；人设扮演建议 0.7 ~ 0.9
temperature=0.8
