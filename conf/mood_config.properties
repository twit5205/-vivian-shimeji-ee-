# =============================================================
# 情绪反应配置（阶段2 · 可变表情模式）
# 每个情绪 → 桌宠行为名（behaviors.xml 里已有的顶层行为）。
# 留空/删行 = 该情绪不触发动作（桌宠无反应）。
# 修改后重启桌宠生效。想换表情/反应，改这里即可，无需改代码。
# =============================================================

# 开心 / 赞美
mood.happy=VivianHappy

# 思考 / 疑惑
mood.thinking=VivianThinking

# 惊讶
mood.surprised=VivianSurprised

# 失落 / 难过
mood.sad=VivianSad

# 生气 / 吐槽（暂不触发，风险较高）
mood.angry=

# 告别（需地面移动，暂不触发）
mood.farewell=

# 默认（不触发）
mood.default=
