# ============================================================
#  小紫语音助手配置（全部可选；不写就用 voice_config.py 里的默认值）
#  改完直接重启 start_voice.bat 生效，不需要改代码。
#  环境变量可临时覆盖：VOICE_BARGE_IN=0 python voice_assistant.py
# ============================================================

# ---------- 音频设备 ----------
# 留空 = 跟随 Windows 当前默认设备（推荐先这样跑）
# 想让延迟更低：改成 WASAPI（doctor.py 会提示）
input_device=
output_device=
# input_device=WASAPI
# output_device=WASAPI

# ---------- 端点检测（说话起止判定）----------
# endpoint_silence_ms 越小反应越快，但用户思考性停顿时容易被抢话
endpoint_silence_ms=650
min_speech_ms=350
pre_pad_ms=250
vad_threshold=0.50
vad_neg_threshold=0.30
peak_floor=0.030
max_utterance_s=20
min_rms=0.0035

# ---------- 语音识别 ----------
# 想要更准可换 medium / large-v3-turbo（CPU 上会明显变慢）
stt_model=small
stt_device=cpu
stt_compute_type=int8
stt_language=zh
# 热词：人名、术语、专有名词，明显降低错字
stt_hotwords=薇薇安，班希，新艾利都，反舌鸟，怪盗

# ---------- 大模型 ----------
llm_model=deepseek-chat
llm_max_tokens=500
llm_temperature=0.8

# ---------- 语音合成 ----------
# auto = vva 音色优先、失败回退 Edge-TTS；也可强制 vva 或 edge
tts_engine=auto
tts_voice=zh-CN-XiaoxiaoNeural
tts_rate=+0%
# 单句上限越小首音越快，但语气连贯性略降
tts_max_sentence_chars=45
tts_first_soft_chars=12

# ---------- 插话打断 ----------
# 外放且回声大时先设 0，戴上耳机后再打开
barge_in=1
barge_in_vad=0.65
barge_in_peak=0.080
barge_in_frames=4
barge_in_peak_ratio=2.5

# ---------- 其他 ----------
# 首次识别到有效语音后再播这句提示；留空则不播
startup_announce=语音已启动
# 每轮打印各阶段耗时，排查卡顿用
log_latency=1
